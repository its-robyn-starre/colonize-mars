#How often controller will check structure. 1 means every tick, 20 means every second. Default: 10
# Default: 10
# Range: 1 ~ 100
structureValidationRate = 10
#Enables the Debug Tool Item's functionality (Disable when on server). Default: true
debugTool = true
#Splits JEI recipe viewer categories by the structure they belong to. Default: true
splitRecipesJei = true
#The default value of 'autoPush' (when not set) on ports that support automatic extract to nearby storages. Default: false
portsAutoExtractByDefault = false
#The default value of 'parallelProcessing' (when not set) on structures that support parallel processing. Default: false
parallelProcessingDefault = false
#The max Parallel Recipes per controller. Default: 5
# Default: 5
# Range: 1 ~ 100
maxParallelRecipes = 5
#Show 'Max Parallel Processing' line in JEI structure view. Default: true
showJeiMaxParallel = true
#How often ports with enabled auto push/pull sides transfer, in ticks. Default: 10
# Default: 10
# Range: 1 ~ 200
portAutoIOInterval = 10
#How many blocks Assemble places per tick. Default: 2
# Default: 2
# Range: 1 ~ 64
assemblyBlocksPerTick = 2
#How often a machine linked to an AE2 network sends its outputs to it, in ticks. Default: 20
# Default: 20
# Range: 1 ~ 1200
networkLinkOutputInterval = 20
#When a port of a linked machine is removed, send its contents to the AE2 network instead of dropping them. Default: true
networkLinkSendOnRemove = true
#Operators may open and break machines linked to other players. Default: true
networkLinkOpBypass = true

[tool]
	#Max FE the Structure Builder can store. Default: 1,000,000
	# Default: 1000000
	# Range: > 1
	toolEnergyCapacity = 1000000
	#FE cost per block placed by the Structure Builder. Default: 50
	# Default: 50
	# Range: > 0
	toolEnergyPerPlacedBlock = 50
	#FE cost per block dismantled by the Structure Builder. Default: 25
	# Default: 25
	# Range: > 0
	toolEnergyPerDismantledBlock = 25
	#Max FE/t the Structure Builder accepts from an external charger. Default: 10,000
	# Default: 10000
	# Range: > 1
	toolEnergyReceiveRate = 10000

#Preview features that are not yet stable or ready for use.
[preview_features]
	#Blueprint screen (JEI structure view with more fancy buttons). Default: false
	previewBlueprintScreen = false
