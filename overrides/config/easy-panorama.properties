# Restart Minecraft after changing this.
# true hides all capture UI and removes the F8 key binding. Exported panoramas still work.
hideCaptureUI=false
# Maximum exported face size: 256-2048. 512 keeps modpack downloads compact.
# Existing Easy Panorama exports are optimized on startup too.
maxFaceSize=512

# Compact defaults applied once by Easy Panorama 1.0.8.
# You can increase maxFaceSize again after this upgrade if desired.
compactDefaultsVersion=2
